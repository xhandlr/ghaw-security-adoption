# Paths and dataset settings. Values marked TODO require a methodological
# decision by the researcher and must not be filled in automatically.

dataset:
  repo_id: pavtch/GHAW-H
  revision: 9ccc840bd7e96fd90db3a16548d5482c2833c47d  # pinned 2026-09-27, matches data/raw/download_log.json

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: results
  coding_dir: coding

snapshot_selection:
  criterion: latest rank per source_markdown_file_history_id

gh_aw_schema:
  repo: github/gh-aw
  path: pkg/parser/schemas/main_workflow_schema.json
  commit: 5ecd40a4b200fb525d123b749597199d6149df36  # pinned 2026-09-28, last commit that touched this schema file

gh_aw_docs:
  architecture_path: docs/src/content/docs/introduction/architecture.mdx  # source of /introduction/architecture/, read at gh_aw_schema.commit

rq2:
  pilot_sample_size: 240  # minimum n for +/-5% margin of error at 95% confidence, p=0.5 (conservative)
  random_seed: 42
  recoding_sample_size: 30  # rows re-coded to check consistency of the manual coding
  recoding_seed: 7  # distinct from random_seed so the draw is independent of the pilot sample
  eligibility:  # workflows without instructions written in the body are excluded before sampling
    no_instructions: true  # nothing left after removing HTML comments, blank lines and heading lines (#)
    only_expression_pattern: '^\s*\$\{\{[^}]*\}\}\s*$'  # body is only a ${{ ... }} expression
  sample_size:  # parameters for the RQ2 sample size (script 27)
    confidence: 0.95
    margin: 0.05
    p: 0.5  # most conservative value
  coder2_rows: 30  # pilot rows given to the second coder (orden 1 to N)
  categories:  # consolidated RQ2 categories (pilot, preliminary); see coding/rq2_codebook.md
    - No tratar el contenido como órdenes
    - Restringir acciones sobre el contenido
    - Restringir la divulgación de información sensible
    - Delimitar comandos de activación
