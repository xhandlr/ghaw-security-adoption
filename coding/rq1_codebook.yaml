      decision: modified
      reason: "Applies the definition of modified: declared value different from the default."
    direction:
      applies_to: modified
      order: >
        The first category that matches applies. Each declared key of the
        mapping is classified with dimensions.keys, as in tools.github.
        Keys with no direction do not change the result when other keys
        have one.
      categories:
        - id: createissue_dir_mixed
          type: dimensions
          match: broadens_and_narrows
          direction: no_direction
          reason: Some keys broaden and others narrow, as in tools.github.
        - id: createissue_dir_broadens
          type: dimensions
          match: broadens_only
          direction: more_permissive
          broadens: from_keys
          reason: At least one key broadens and none narrows.
        - id: createissue_dir_narrows
