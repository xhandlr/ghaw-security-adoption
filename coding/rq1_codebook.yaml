  safe-outputs.noop:
    default:
      enabled: true
      max: 1
      report-as-issue: true
    source:
      - file: docs/src/content/docs/reference/safe-outputs.md
        line: 1262
        quote: "Enabled by default."
      - file: pkg/parser/schemas/main_workflow_schema.json
        line: 11416
        quote: "Maximum number of noop messages (default: 1)"
      - file: pkg/parser/schemas/main_workflow_schema.json
        line: 11421
        quote: "\"default\": 1"
      - file: pkg/parser/schemas/main_workflow_schema.json
        line: 11436
        quote: "Controls whether noop runs are reported as issue comments (default: true)."
      - file: pkg/parser/schemas/main_workflow_schema.json
        line: 11437
        quote: "\"default\": true"
    granularity: Child of safe-outputs, measured as its own unit (guide section 5, no evidence of dependency).
    dimensions:
      keys:
        - key: report-as-issue
          test: {value_in: [true]}
          effect: equal
          reason: Equal to the default.
        - key: report-as-issue
          test: {value_in: [false]}
          effect: narrows
          reason: The noop message is not posted as an issue comment.
          source:
            file: pkg/parser/schemas/main_workflow_schema.json
            line: 11436
            quote: "Set to false to disable posting to the no-op runs issue."
        - key: max
          test: {value_in: [1]}
          effect: equal
          reason: Equal to the default.
        - key: max
          test: {number_above: 1}
          effect: broadens
          broadens: noop messages
          reason: More noop messages than the default. The schema minimum is 1 (line 11420), so no number narrows.
        - key: max
          test: {present: true}
          effect: no_direction
          reason: A GitHub Actions expression, whose value is not known until the workflow runs.
      unlisted_keys: no_direction
    equal_to_default:
