            file: pkg/parser/schemas/main_workflow_schema.json
            line: 6194
            quote: "Enable issue creation with default configuration"
        - id: createissue_all_keys_equal
          type: dimensions
          match: all_equal
          reason: An empty mapping, or a mapping where every declared key equals its default.
    rest:
      id: createissue_rest
