          test: {value_in: [1]}
          effect: equal
          reason: Equal to the default.
        - key: max
          test: {number_above: 1}
          effect: broadens
          broadens: issues created
          reason: More issues than the default.
          source:
            file: pkg/parser/schemas/main_workflow_schema.json
            line: 6051
            quote: "Maximum number of issues to create (default: 1)"
        - key: max
