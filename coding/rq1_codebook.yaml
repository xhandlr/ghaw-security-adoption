        The first category that matches applies. Each declared key of the
        mapping is classified with dimensions.keys, as in tools.github.
      categories:
        - id: noop_dir_false
          type: exact_value
          value: false
          direction: more_restrictive
          reason: Disables the noop output.
        - id: noop_dir_mixed
          type: dimensions
          match: broadens_and_narrows
          direction: no_direction
          reason: Some keys broaden and others narrow, as in tools.github.
        - id: noop_dir_broadens
          type: dimensions
          match: broadens_only
          direction: more_permissive
          broadens: from_keys
          reason: At least one key broadens and none narrows.
        - id: noop_dir_narrows
          type: dimensions
          match: narrows_only
          direction: more_restrictive
