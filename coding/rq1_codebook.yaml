          - add-labels
          - remove-labels
          - assign-milestone
          - assign-to-agent
          - assign-to-user
          - unassign-from-user
          - set-issue-type
          - set-issue-field
          - jira-create-issue
          - jira-update-issue
          - jira-add-comment
          - jira-add-label
          - create-project
          - update-project
          - create-project-status-update
          - update-release
          - upload-artifact
          - upload-asset
          - ado-create-work-item
          - ado-update-work-item
          - ado-comment-on-work-item
          - ado-assign-work-item
          - ado-link-work-items
          - ado-upload-workitem-attachment
          - dispatch-workflow
          - call-workflow
          - dispatch-repository
          - create-code-scanning-alert
          - autofix-code-scanning-alert
          - create-check-run
          - create-agent-session
          - linear-create-issue
          - linear-add-comment
          - linear-update-issue
      undetermined_keys: [jobs]
      undetermined_reason: >
        safe-outputs.jobs (custom safe output jobs, safe-outputs.md line 154)
        is not in the system types table, and no source states whether it
        prevents create-issue from being injected.
      disabled:
        id: createissue_disabled_declared
        direction: more_permissive
        direction_id: createissue_dir_enabled
        broadens: issue creation
        reason: >
          With another non-system safe output, create-issue is not injected, so
          declaring it (null or an object with any keys) enables issue
          creation. Its inner keys do not change the direction.
      undetermined:
        id: createissue_jobs_undetermined
        reason: The parent has jobs and no other non-system safe output.
    dimensions:
