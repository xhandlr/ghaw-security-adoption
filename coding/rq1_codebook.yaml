      enabled_by_others:
        note: >
          Non-system safe output types: the keys of the tables of safe output
          types in safe-outputs.md (lines 31 to 118), without create-issue.
          If the parent declares any of them, create-issue is not injected.
        source:
          file: docs/src/content/docs/reference/safe-outputs.md
          lines: 31-118
        keys:
          - update-issue
          - close-issue
          - link-sub-issue
          - create-discussion
          - update-discussion
          - close-discussion
          - create-pull-request
          - update-pull-request
          - close-pull-request
